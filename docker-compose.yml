services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: wilayah_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-db_wilayah_pusat}
      DB_USERNAME: ${DB_USERNAME:-wilayah_user}
      DB_PASSWORD: ${DB_PASSWORD:-wilayah_secret}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wilayah_net

  web:
    image: nginx:1.25-alpine
    container_name: wilayah_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - wilayah_net

  db:
    image: mysql:8.0.36
    container_name: wilayah_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "${DB_EXTERNAL_PORT:-33066}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-db_wilayah_pusat}
      MYSQL_USER: ${DB_USERNAME:-wilayah_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-wilayah_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/spatial.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      timeout: 10s
      retries: 5
      interval: 5s
    networks:
      - wilayah_net

networks:
  wilayah_net:
    driver: bridge

volumes:
  mysql_data:
    driver: local